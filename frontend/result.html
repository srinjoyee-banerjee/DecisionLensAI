<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
DecisionLens AI Report
</title>


<link rel="stylesheet"
href="style.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>


<body>


<nav>


<div class="logo">

DECISION<span>LENS</span>

</div>


<div class="nav-links">

<a href="/">
HOME
</a>


<a href="/dashboard.html">
WORKSPACE
</a>

</div>


</nav>





<main class="dashboard">



<h1>
DECISIONLENS / INTELLIGENCE REPORT
</h1>




<!-- SUMMARY -->


<section class="card">


<h2>
AI UNDERSTANDING
</h2>


<div id="intelligence">

</div>


</section>





<!-- RECOMMENDATION -->


<section class="card recommendation">


<h2>
PRIMARY DECISION PATH
</h2>


<h1 id="choice">
--
</h1>


<div class="confidence">

CONFIDENCE

<span id="confidence">
--
</span>


</div>


<p id="reason">

</p>



</section>







<!-- MATRIX -->


<section class="card">


<h2>
DECISION MATRIX
</h2>


<canvas id="matrixChart">

</canvas>


</section>






<!-- RISK -->


<section class="card">


<h2>
RISK VS REWARD SIMULATION
</h2>


<canvas id="riskChart">

</canvas>


</section>







<!-- FUTURE -->


<section class="card">


<h2>
FUTURE TIMELINE
</h2>


<div id="timeline">

</div>


</section>







<!-- PATHS -->


<section class="card">


<h2>
ALTERNATIVE FUTURES
</h2>



<div id="futurePaths">

</div>



</section>








<section class="card">


<h2>
WHY THIS CHOICE
</h2>


<ul id="why">

</ul>


</section>





<section class="card">


<h2>
TRADE OFFS
</h2>


<ul id="tradeoffs">

</ul>


</section>



</main>









<script>


const result =
JSON.parse(

localStorage.getItem(
"decisionResult"
)

);




if(result){



// ======================
// INTELLIGENCE
// ======================


document.getElementById(
"intelligence"
).innerHTML = `


<p>
<b>Domain:</b>
${result.decision_intelligence.domain}
</p>


<p>
<b>Goals:</b>
${result.decision_intelligence.detected_goals.join(", ")}
</p>


<p>
<b>Query:</b>
${result.decision_intelligence.question}
</p>


`;







// ======================
// RECOMMENDATION
// ======================



document.getElementById(
"choice"
).innerHTML =

result.recommendation.choice;



document.getElementById(
"confidence"
).innerHTML =

result.recommendation.confidence
+
"%";



document.getElementById(
"reason"
).innerHTML =

result.recommendation.reason;








// ======================
// MATRIX CHART
// ======================



let matrix =
result.decision_matrix;



new Chart(

document.getElementById(
"matrixChart"
),

{

type:"radar",

data:{


labels:
matrix.factors,


datasets:[

{

label:
result.options[0],

data:
matrix[result.options[0]]

},


{

label:
result.options[1],

data:
matrix[result.options[1]]

}

]

},


options:{


responsive:true

}

}


);








// ======================
// RISK CHART
// ======================



let rr =
result.risk_reward;



new Chart(

document.getElementById(
"riskChart"
),

{

type:"bar",

data:{


labels:

result.options,


datasets:[

{

label:
"Risk",

data:[

rr[result.options[0]].risk,

rr[result.options[1]].risk

]

},


{

label:
"Reward",

data:[

rr[result.options[0]].reward,

rr[result.options[1]].reward

]

}


]

},


options:{


responsive:true


}


}


);










// ======================
// TIMELINE
// ======================


let timeline =
result.timeline[
result.recommendation.choice
];



let timelineBox =
document.getElementById(
"timeline"
);



timeline.forEach(t=>{


let div =
document.createElement(
"div"
);


div.className =
"timeline-item";


div.innerHTML=t;


timelineBox.appendChild(div);



});









// ======================
// FUTURE PATHS
// ======================


let paths =
result.future_paths;



let pathBox =
document.getElementById(
"futurePaths"
);



Object.keys(paths).forEach(
key=>{


let div =
document.createElement(
"div"
);


div.className =
"future-card";


div.innerHTML=

`

<h3>
${key}
</h3>

<p>
${paths[key]}
</p>

`;



pathBox.appendChild(div);



});








// ======================
// LISTS
// ======================


function fill(id,data){


let box =
document.getElementById(id);


data.forEach(item=>{


let li =
document.createElement(
"li"
);


li.innerHTML=item;


box.appendChild(li);


});


}



fill(
"why",
result.why
);



fill(
"tradeoffs",
[

"Short term benefit vs long term value",

"Risk vs reward",

"Specialization vs flexibility"

]

);



}



else{


document.body.innerHTML=

`

<h2>
No Decision Data Found
</h2>

`;

}



</script>



</body>

</html>
