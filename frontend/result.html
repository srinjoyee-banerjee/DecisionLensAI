<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Decision Report | DecisionLens AI</title>

<link rel="stylesheet"
href="style.css">

</head>


<body>


<nav>

<div class="logo">
DECISION<span>LENS</span>
</div>

<a href="/" class="back">
← NEW DECISION
</a>

</nav>


<main class="report">


<div class="report-header">

<div class="eyebrow">
DECISION INTELLIGENCE REPORT
</div>

<h1>
AI Decision <span>Analysis</span>
</h1>

<div id="query"
class="query-box">

Loading decision...

</div>

</div>


<section class="dashboard-grid">


<div class="panel recommendation">

<div class="panel-label">
RECOMMENDATION
</div>

<div id="recommendation">
Analyzing...
</div>

</div>


<div class="panel">

<div class="panel-label">
AGENT TRACE
</div>

<div id="tools"
class="tools">

Loading...

</div>

</div>


<div class="panel wide">

<div class="panel-label">
AI ANALYSIS
</div>

<div id="analysis"
class="analysis">

Loading...

</div>

</div>


<div class="panel">

<div class="panel-label">
RETRIEVED EVIDENCE
</div>

<div id="evidence">

Loading...

</div>

</div>


<div class="panel">

<div class="panel-label">
SYSTEM
</div>

<div class="system-status">

<div>
<span class="dot"></span>
RAG ACTIVE
</div>

<div>
<span class="dot"></span>
LLM ACTIVE
</div>

<div>
<span class="dot"></span>
AGENT ACTIVE
</div>

</div>

</div>


</section>

</main>


<script src="script.js"></script>

</body>

</html>
