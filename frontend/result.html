<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>DecisionLens AI Report</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<div class="logo">
DECISION<span>LENS</span>
</div>


<div class="nav-links">

<a href="/">HOME</a>

<a href="/dashboard.html">
WORKSPACE
</a>

</div>

</nav>




<main class="report">


<h1>
DECISIONLENS / AI DECISION REPORT
</h1>





<section class="card">


<h2>
Decision Intelligence
</h2>


<p id="question">
Loading decision...
</p>



<div class="confidence">

AI CONFIDENCE

<span id="confidence">
--
</span>


</div>


</section>







<section class="card recommendation">


<h2>
PRIMARY RECOMMENDATION
</h2>



<h1 id="recommendation">
--
</h1>



<p id="finalAdvice">
--
</p>



</section>







<section class="card">

<h2>
WHY THIS CHOICE
</h2>


<ul id="why"></ul>


</section>







<section class="card">


<h2>
WHY NOT THE ALTERNATIVE
</h2>


<ul id="whyNot"></ul>


</section>







<section class="card">


<h2>
ADVANTAGES
</h2>


<ul id="advantages"></ul>


</section>







<section class="card">


<h2>
DISADVANTAGES
</h2>


<ul id="disadvantages"></ul>


</section>







<section class="card">


<h2>
TRADE-OFFS
</h2>


<ul id="tradeoffs"></ul>


</section>





</main>






<script>


// ============================================================
// LOAD DECISION REPORT
// ============================================================


const result =
JSON.parse(

localStorage.getItem(
"decisionResult"
)

);






if(result){



document.getElementById(
"question"
).innerHTML =


result.decision_intelligence ||

result.decision ||

"Decision Analysis";





document.getElementById(
"confidence"
).innerHTML =


(result.confidence || 0)
+
"%";







document.getElementById(
"recommendation"
).innerHTML =


result.recommendation ||

"--";







document.getElementById(
"finalAdvice"
).innerHTML =


result.primary_reason ||

result.final_advice ||

"";








function fill(id,data){



const box =
document.getElementById(id);



box.innerHTML="";



if(
Array.isArray(data)
&&
data.length>0
){


data.forEach(
item=>{


const li =
document.createElement(
"li"
);


li.innerHTML=item;


box.appendChild(li);


}

);


}

else{


box.innerHTML =
"<li>No information available</li>";

}



}






fill(
"why",
result.why
);



fill(
"whyNot",
result.why_not
);



fill(
"advantages",
result.advantages
);



fill(
"disadvantages",
result.disadvantages
);



fill(
"tradeoffs",
result.tradeoffs
);






}

else{


document.querySelector(
".report"
).innerHTML =

`

<section class="card">

<h2>
No decision data found
</h2>

<p>
Please return to workspace and analyze a decision.
</p>

</section>

`;



}



</script>




</body>

</html>
