<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DecisionLens AI</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<nav>

<div class="logo">
DECISION<span>LENS</span>
</div>

<div class="nav-label">
RAG • LLM • AGENTIC AI
</div>

</nav>


<main class="hero">

<section class="hero-content">

<div class="eyebrow">
AI DECISION INTELLIGENCE
</div>

<h1>
Make better<br>
<span>decisions.</span>
</h1>

<p class="subtitle">

Type a decision. DecisionLens retrieves
relevant knowledge, selects AI tools,
and generates an evidence-based analysis.

</p>


<div class="input-card">

<label>
WHAT ARE YOU DECIDING?
</label>

<textarea
id="decisionInput"
placeholder="Example: Should I learn Data Science or Machine Learning?"
></textarea>


<button onclick="analyzeDecision()">

ANALYZE DECISION

<span>→</span>

</button>

</div>


<div class="examples">

<span>TRY:</span>

<button onclick="setExample('Should I learn Python or Java?')">
Python vs Java
</button>

<button onclick="setExample('Should a startup build or buy its software?')">
Build vs Buy
</button>

<button onclick="setExample('Should I choose AWS or Azure for my startup?')">
AWS vs Azure
</button>

</div>

</section>

</main>


<footer>
DECISIONLENS AI / DECISION INTELLIGENCE SYSTEM
</footer>


<script src="script.js"></script>

</body>

</html>
